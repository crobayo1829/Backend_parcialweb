spring.application.name=bodegas-backend
server.port=8080

# --- Base de datos por defecto: H2 en memoria (no requiere instalación) ---
spring.datasource.url=jdbc:h2:mem:bodegasdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- CORS: origen del frontend Angular ---
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
